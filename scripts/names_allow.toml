# Allowlist of scripts/check_names.py (CONTRIBUTING §4.5). One entry per (declaration, rule) the
# checker misreads, with a one-line reason saying why the grammar has no readable form for the
# statement or why the checker's reading is wrong. Reviewed like code; never the fix for a real
# violation. The checker fails on a stale entry.

[[allow]]
name = "Metric.IsUniformApproxOn.apply"
rule = "N2"
reason = "structure-field style API (`h.apply hx` : dist (g x) (f x) ≤ ε), as Mathlib's `…Apply` lemmas; the head is the predicate"

[[allow]]
name = "Metric.IsUniformApproxOn.apply"
rule = "N3"
reason = "structure-field style API: the relation is the predicate's own, named by the namespace"

[[allow]]
name = "exists_bernstein_exponent"
rule = "N3"
reason = "names the optimised exponent θ of Bernstein's argument; the inequality has no token form shorter than the statement"

[[allow]]
name = "Matrix.IsHermitian.ext_quadForm"
rule = "N4"
reason = "an ext lemma is named for the hypothesis it compares (`quadForm A z = quadForm B z`), as Mathlib's `ext_…`"

[[allow]]
name = "NLAlib.exists_forall_integral_norm_sub_kaczmarzIterate_sq_le_mul_add_of_hasLaw_iidSequence_of_mul_log_le"
rule = "N17"
reason = "the derived name drops the right-side `mul_add` and collides with the consistent form `exists_forall_integral_norm_sub_kaczmarzIterate_sq_le_of_hasLaw_iidSequence_of_mul_log_le`; the right side tells the two apart (N8)"

[[allow]]
name = "Matrix.IsHermitian.integral_pow_spectralMeasure"
rule = "N6"
reason = "Mathlib's `integral_pow` idiom (the integrand `x ^ k` is the argument of `integral_`, the measure follows); `pow` comes after its argument `x`, the checker reads `spectralMeasure` as its argument"

[[allow]]
name = "NLAlib.integral_frobNorm_sub_truncatedSVD_rsvd_sub_rangeProjector_sq_of_hasLaw_gaussianMatrix"
rule = "N10"
reason = "the error A − ⟦R⟧ₖ − P·N of the oracle truncation is exact − computed; `rsvd_sub` is inside the computed part"

[[allow]]
name = "NLAlib.integral_frobNorm_sub_truncatedSVD_rsvd_sub_rangeProjector_sq_le_of_hasLaw_gaussianMatrix"
rule = "N10"
reason = "the error A − ⟦R⟧ₖ − P·N of the oracle truncation is exact − computed; `rsvd_sub` is inside the computed part"

[[allow]]
name = "NLAlib.QueryAlgorithm.IsMeasurable.measure_queryAt_notMem_span_and_mulVec_mem_span_eq_zero"
rule = "N9"
reason = "LB-A R4b, named by its event (design note §9); with `_of_hasLaw_gaussianMatrix` the theorem name is 103 characters, past the line limit (decision NAME-R4B, Review-LBA.json)"

[[allow]]
name = "NLAlib.IsChebyshevTwoIntervalSpectrum.measureReal_exists_norm_sub_mulVec_lt_le"
rule = "N9"
reason = "LB-C SH1 (design note §3.5); with `_of_hasLaw_gaussianMatrix` the declaration line is 105 characters, past the line limit (as NAME-R4B)"

[[allow]]
name = "NLAlib.mul_frobNorm_mul_truncatedSVD_sq_add_le"
rule = "N2"
reason = "TGN-Upper L34h (head weight): the conclusion is `3 / 8 * ‖W B_a‖² + … ≤ …`, and the checker reads the literal `3 / 8` as `div`, `ofNat`, `three` instead of the scalar factor that N2 admits as `mul_`"

[[allow]]
name = "NLAlib.mul_frobNorm_mul_one_sub_sq_add_le"
rule = "N2"
reason = "TGN-Upper L34t (tail weight): the conclusion is `3 / 8 * θ² * ‖W (1 - P_b)‖² + … ≤ …`, and the checker reads the literal `3 / 8` as `div`, `ofNat`, `three` instead of the scalar factor that N2 admits as `mul_`"

[[allow]]
name = "NLAlib.exists_forall_integral_frobNorm_sub_truncatedSVD_generalizedNystrom_sq_le_add_of_hasLaw_gaussianMatrix"
rule = "N17"
reason = "TGN-Upper M1: the derived name `exists_forall_integral_frobNorm_sub_truncatedSVD_generalizedNystrom_sq_le_of_hasLaw_gaussianMatrix` is held by the older asymptotic form of the p ≥ 8000ℓ/ε theorem (decision card TGN-DOMINATED)"

[[allow]]
name = "NLAlib.exists_forall_integral_frobNorm_sub_truncatedSVD_generalizedNystrom_sq_le_one_add_of_hasLaw_gaussianMatrix"
rule = "N17"
reason = "TGN-Upper M2: the derived name `exists_forall_integral_frobNorm_sub_truncatedSVD_generalizedNystrom_sq_le_of_hasLaw_gaussianMatrix` is held by the older asymptotic form of the p ≥ 8000ℓ/ε theorem, which M2 dominates (decision card TGN-DOMINATED)"

[[allow]]
name = "NLAlib.map_eval_uniformOn_injective"
rule = "N4"
reason = "`eval` is Mathlib's reading of `fun f => f j` (`Function.eval`); the token became a library function with `NLAlib.Computation.IExp.eval`, a different object"


[[allow]]
name = "NLAlib.LanczosRun.transpose_dilatedBasis_mul_dilatedBasisSucc_mul"
rule = "N4"
reason = "the statement is `L.dilatedBasisᵀ * (L.dilatedBasisSucc * L.tridiagonalSucc) = L.tridiagonal`; the checker does not read the token `dilatedBasis` with `ᵀ` attached"

[[allow]]
name = "NLAlib.LanczosData.transpose_dilatedBasis_mul_dilatedBasisSucc_mul"
rule = "N4"
reason = "the statement is `D.dilatedBasisᵀ * (D.dilatedBasisSucc * D.tridiagonalSucc) = D.tridiagonal`; the checker does not read the token `dilatedBasis` with `ᵀ` attached (as for its LanczosRun counterpart)"
