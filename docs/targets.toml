witness_sem = "exact stored-entries model (no contract); P = ι = Unit; N = N₀ + 1, n = (1); input b = 0"
hash = "3070e9a02bd2dced5e4c15a7e63fd7bb1e81c16a9093cfe3548c1fef31b16435"
statement = '''
∀ (P ι : Type) [inst : DecidableEq P] (tag : P),
  NLAlib.Computation.StoredEntries tag (NLAlib.lanczosReorthProg.compiled tag) (fun x x_1 => True)
    (fun N x => Fin N → ℝ)
    (fun N q b =>
      ![Array.map some (Array.ofFn b), Array.replicate (N * (q 0 + 1)) none,
        Array.replicate (q 0) none, Array.replicate (q 0 + 1) none, Array.replicate 1 none,
        Array.replicate N none, Array.replicate (q 0) none])
    (fun N x => N ^ 2) (fun N q => NLAlib.lanczosReorthCount tag N (q 0))
    (fun N q p => if p = tag then 2 * N ^ 2 + N * (q 0 + 5) + 5 * q 0 + 7 else 0)
    fun N q b vals x st =>
    have A := fun i j => vals (↑i + N * ↑j);
    (NLAlib.Computation.Holds st.store tag 0 0 fun i x => b i) ∧
      NLAlib.Computation.Holds st.store tag 1 0 (NLAlib.lanczosReorthMatrix A b (q 0 + 1)) ∧
        (NLAlib.Computation.Holds st.store tag 2 0 fun j x =>
            NLAlib.lanczosAlpha A (NLAlib.lanczosReorthState A b ↑j).toLanczosState) ∧
          (NLAlib.Computation.Holds st.store tag 3 0 fun j x =>
              (NLAlib.lanczosReorthState A b ↑j).beta) ∧
            st.store.read tag 4 0 = some ‖WithLp.toLp 2 b‖ ∧
              (NLAlib.Computation.Holds st.store tag 5 0 fun i x =>
                  (NLAlib.lanczosReorthState A b (q 0)).prev i) ∧
                NLAlib.Computation.Holds st.store tag 6 0 fun j x =>
                  (NLAlib.lanczosReorthState A b (↑j + 1)).nu'''

