statement = '''
∀ (P ι : Type) [inst : DecidableEq P] (p : P) (o : ι) (d : NLAlib.Computation.Dist) (𝕜 : Type)
  [inst_1 : RCLike 𝕜],
  NLAlib.Computation.MatrixFree p (NLAlib.hutchppProg.compiled p o d) (fun x n => 0 < n 1)
    (fun x x_1 => Unit) (fun x x_1 x_2 => ![Array.replicate 1 none])
    (fun N n => NLAlib.hutchppCount p o d N (n 0) (n 1))
    (fun N n q => if q = p then 2 * N * (n 0 + n 1) + 4 else 0) fun N n x A ξ st =>
