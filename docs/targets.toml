statement = '''
∀ (P ι : Type) [inst : DecidableEq P] (tag : P) (o : ι),
  NLAlib.Computation.MatrixFree tag (NLAlib.lanczosReorthOracleProg.compiled tag o)
    (fun x x_1 => True) (fun N x => Fin N → ℝ)
    (fun N q b =>
      ![Array.map some (Array.ofFn b), Array.replicate (N * (q 0 + 1)) none,
        Array.replicate (q 0) none, Array.replicate (q 0 + 1) none, Array.replicate 1 none,
        Array.replicate N none, Array.replicate (q 0) none])
    (fun N q => NLAlib.lanczosReorthOracleCount tag o N (q 0))
    (fun N q p => if p = tag then N * (q 0 + 5) + 5 * q 0 + 7 else 0) fun x q b A x_1 st =>
    (NLAlib.Computation.Holds st.store tag 0 0 fun i x => b i) ∧
      NLAlib.Computation.Holds st.store tag 1 0 (NLAlib.lanczosReorthMatrix A b (q 0 + 1)) ∧
        (NLAlib.Computation.Holds st.store tag 2 0 fun j x_2 =>
            NLAlib.lanczosAlpha A (NLAlib.lanczosReorthState A b ↑j).toLanczosState) ∧
          (NLAlib.Computation.Holds st.store tag 3 0 fun j x_2 =>
              (NLAlib.lanczosReorthState A b ↑j).beta) ∧
            st.store.read tag 4 0 = some ‖WithLp.toLp 2 b‖ ∧
              (NLAlib.Computation.Holds st.store tag 5 0 fun i x_2 =>
                  (NLAlib.lanczosReorthState A b (q 0)).prev i) ∧
                NLAlib.Computation.Holds st.store tag 6 0 fun j x_2 =>
                  (NLAlib.lanczosReorthState A b (↑j + 1)).nu'''

