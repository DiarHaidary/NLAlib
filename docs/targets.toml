  NLAlib.Computation.StoredEntries p (NLAlib.hutchppProg.compiledCoo p o d pattern)
    (fun N n => 0 < n 1 ∧ ∀ ij ∈ pattern, ij.1 < N ∧ ij.2 < N) (fun x x_1 => Unit)
    (fun x x_1 x_2 => ![Array.replicate 1 none]) (fun x x_1 => pattern.length)
    (fun N n =>
      (NLAlib.Computation.substCount (NLAlib.Computation.cooCost N pattern.length))
        (NLAlib.hutchppCount p o d N (n 0) (n 1)))
    (fun N n q =>
      (if q = p then 2 * N * (n 0 + n 1) + 4 else 0) + 1 + if q = p then pattern.length else 0)
    fun N n x vals ξ st =>
    st.store.read p 0 0 =
      some
        (NLAlib.hutchpp (NLAlib.Computation.cooMatrix pattern vals)
          (NLAlib.Computation.tapeMatrix (ξ d) 0 N (n 0))
          (NLAlib.Computation.tapeMatrix (ξ d) (N * n 0) N (n 1)))'''

