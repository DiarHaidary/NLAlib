# The registry of target statements (docs/design/Computation.md, "First-order programs and target
# statements", F1 and F12). A published cost result is a theorem whose type is one of these
# targets; scripts/Targets.lean (rule E3) checks that each has exactly one proof, that the closure
# hash of each (every library constant its statement reaches, the registered trees as leaves
# hashed by their constructor normal forms) and its printed statement match this file, that the
# toolchain and the Mathlib revision are the build's, and that docs/targets.approved holds the
# SHA-256 of this file.
#
# Changes need the maintainer's approval (Q3): agents never edit this file or a *Targets.lean
# file. After an approved change of a target, `TARGETS_UPDATE=1 lake env lean scripts/Targets.lean`
# rewrites the hashes, the printed statements and the pins; the maintainer reviews the diff and
# approves it with `sha256sum docs/targets.toml > docs/targets.approved`.
#
# [[tree]]    a registered tree: name, hash (of its type and constructor normal form)
# [[target]]  name, file (its *Targets.lean file), trees (the registered trees it names),
#             precomputed (declared inputs computed from the sizes, Q5), reviewed (the date of
#             the maintainer's review), hash (the closure hash), statement (the target unfolded
#             one level, printed)
toolchain = "leanprover/lean4:v4.33.1"
mathlib = "0df444a360eaa60ab8c11dca51a86af692955474"

