          (NLAlib.Computation.tapeMatrix (ξ d) (N * n 0) N (n 1)))'''

[[target]]
name = "NLAlib.MatrixFreeProbHutchpp"
file = "NLAlib/Estimation/Trace/HutchPlusPlusTargets.lean"
trees = ["NLAlib.hutchppProg.compiled"]
precomputed = []
reviewed = "2026-10-23"
hash = "64a762d126a022c3a75ad901c2eb4438792acf34cfde28d68cd784da0129631b"
statement = '''
∀ (P ι : Type) [inst : DecidableEq P] (p : P) (o : ι) (r : ℕ) (δ : ℝ),
  0 < δ →
    ∀ (τ : ℝ),
      0 ≤ τ →
        NLAlib.Computation.MatrixFreeProb p
          (NLAlib.hutchppProg.compiled p o NLAlib.Computation.Dist.gaussian)
          (fun x n =>
            0 < n 0 ∧ 0 < n 1 ∧ NLAlib.subgaussianEmbeddingDim 1 r (1 / 2) (δ / 2) ≤ ↑(n 0))
          (fun x x_1 => Unit) (fun x x_1 x_2 => ![Array.replicate 1 none])
          (fun N n => NLAlib.hutchppCount p o NLAlib.Computation.Dist.gaussian N (n 0) (n 1))
          (fun N n q => if q = p then 2 * N * (n 0 + n 1) + 4 else 0)
          (fun x x_1 x_2 A st => ∃ v, st.store.read p 0 0 = some v ∧ |A.trace - v| < τ)
          fun x n x_1 A =>
          δ +
            2 *
              Real.exp
                (-(NLAlib.hansonWrightConstant *
                    min
                      (↑(n 1) * τ ^ 2 /
                        (NLAlib.subgaussianRangeFinderFactor 1 *
                          NLAlib.frobNorm (A - NLAlib.truncatedSVD A r) ^ 2))
                      (↑(n 1) * τ /
                        (√(NLAlib.subgaussianRangeFinderFactor 1) *
                          NLAlib.frobNorm (A - NLAlib.truncatedSVD A r)))))'''

