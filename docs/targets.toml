statement = '''
∀ (P ι : Type) [inst : DecidableEq P] (p : P) (o : ι) (d : NLAlib.Computation.Dist) (𝕜 : Type)
  [inst_1 : RCLike 𝕜],
  NLAlib.Computation.StoredEntries p (NLAlib.hutchppProg.compiledDense p o d) (fun x n => 0 < n 1)
    (fun x x_1 => Unit) (fun x x_1 x_2 => ![Array.replicate 1 none]) (fun N x => N * N)
    (fun N n =>
      (NLAlib.Computation.substCount (NLAlib.Computation.denseCost N))
        (NLAlib.hutchppCount p o d N (n 0) (n 1)))
    (fun N n q => (if q = p then 2 * N * (n 0 + n 1) + 4 else 0) + 1 + if q = p then N * N else 0)
    fun N n x vals ξ st =>
    st.store.read p 0 0 =
      some
        (NLAlib.hutchpp (Matrix.of fun i j => vals (↑i + N * ↑j))
          (NLAlib.Computation.tapeMatrix (ξ d) 0 N (n 0))
          (NLAlib.Computation.tapeMatrix (ξ d) (N * n 0) N (n 1)))'''

