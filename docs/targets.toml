        Array.replicate N none, Array.replicate 1 none])
    (fun N x => N ^ 2) (fun N q => NLAlib.cgCount tag N (q 0))
    (fun N x p => if p = tag then 2 * N ^ 2 + 5 * N + 11 else 0) fun N q b vals x st =>
