[[constant]]
name = "NLAlib.subgaussianJLDim"
kind = "sample size"
file = "NLAlib/Sketching/Gaussian/SubGaussian.lean"
args = ["c", "ε", "δ"]
latex = '#1^2 \log(2/#3)/(C #2^2)'
display = '\frac{#1^2 \log(2/#3)}{C #2^2}'
lean_body = 'subgaussianJLDim (c ε δ : ℝ) : ℝ := c ^ 2 * Real.log (2 / δ) / (subgaussianJLConstant * ε ^ 2)'
body_hash = "6158744b19cebc1b"

[[constant]]
