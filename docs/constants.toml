[[constant]]
name = "NLAlib.rangeFinderTailRatio"
kind = "ratio"
file = "NLAlib/LowRank/Gaussian/RangeFinder.lean"
args = ["A", "r", "l"]
latex = '1 + #2/(#3 - #2 - 1)\cdot\|#1 - \llbracket#1\rrbracket_#2\|_{\mathsf{F}}^2/\sigma_#2(#1)^2'
display = '1 + \frac{#2}{#3 - #2 - 1}\,\frac{\|#1 - \llbracket#1\rrbracket_#2\|_{\mathsf{F}}^2}{\sigma_#2(#1)^2}'
lean_body = 'rangeFinderTailRatio {𝕜 : Type*} [RCLike 𝕜] (A : Matrix m n 𝕜) (r l : ℕ) : ℝ := 1 + (r : ℝ) / ((l : ℝ) - r - 1) * frobNorm (A - truncatedSVD A r) ^ 2 / singularValues A r ^ 2'
