# Named bounds of NLAlib (CONTRIBUTING §5.2 rule 2): every constant, tail function and sample size
# that a statement uses by name. A docstring that uses one writes its current value inside the
# equation, in place of the constant, and annotates that math span with a marker just before it,
#   <!-- value NAME ARG1 ARG2 … -->
#   $$… \frac{e}{\ell - k}\sqrt{(\ell + k - 1)/2}\,\|\mathbf{E}\|_{\mathsf{F}} …$$
# and `scripts/check_constants.py` checks that the span contains the value filled from this file
# (its docstring has the full rules).
#
# Fields of each entry:
#   name       Lean full name.
#   kind       what it is: constant, tail function, sample size, …
#   explorer_role optional: "support" (default) or "concept". Supporting bounds stay searchable
#              and linked from results, but are not headline catalogue or dependency-graph nodes.
#   file       the file that defines it.
#   args       its explicit arguments, in Lean order; `#i` in `latex` is the i-th. The letters here
#              are the definition's; each docstring passes its own (`k \ell`, `(\varepsilon/2)`).
#   latex      template of the current value: inline LaTeX in CONTRIBUTING §6 notation (`/` rather
#              than `\frac`), placeholders `#1`…`#9` never followed by a letter. `C` in a sample
#              size is the constant it uses, whose value the same docstring shows (`$C = 1/36$`,
#              the one symbol CONTRIBUTING §5.2 rule 2 allows).
#   display    optional: the same value with `\frac`, accepted (besides `latex`) in a `$$…$$`
#              display.
#   lean_body  the definition from its name to its end, whitespace-normalised: the text `latex`
#              must agree with. A reviewer compares the two on every change; nothing checks
#              LaTeX against Lean mathematically.
#   body_hash  sha256 of `lean_body`, first 16 hex digits.
#   previous_latex, previous_display
#              present only while a change is pending: the templates before the change.
#
# To change a constant: edit its body in Lean; here move `latex` to `previous_latex` (and
# `display` to `previous_display`) and write the new value; run
#   python3 scripts/check_constants.py --update NAME
# which replaces the previous value by the new one inside every annotated span, records the new
# `lean_body` and `body_hash` and removes the `previous_*` fields; CI then runs the check.

[[constant]]
name = "NLAlib.psiTwoSubgaussianConstant"
kind = "constant"
file = "NLAlib/Probability/Orlicz.lean"
args = []
latex = '1 + \log 2'
lean_body = 'psiTwoSubgaussianConstant : ℝ≥0 := Real.toNNReal (1 + Real.log 2)'
body_hash = "c44940578e91bd30"

