[[constant]]
name = "NLAlib.gaussianPinvSpecNormBound"
kind = "moment bound"
file = "NLAlib/RandomMatrix/Gaussian/InverseMoments/Spectral.lean"
args = ["r", "k"]
latex = 'e\sqrt{(#2 + #1 - 1)/2}/(#2 - #1)'
display = '\frac{e}{#2 - #1}\sqrt{(#2 + #1 - 1)/2}'
lean_body = 'gaussianPinvSpecNormBound (r k : ℕ) : ℝ := Real.exp 1 / ((k : ℝ) - r) * √(((k : ℝ) + r - 1) / 2)'
body_hash = "4df317e0f785fe6b"

[[constant]]
name = "NLAlib.gaussianPinvFrobTail"
kind = "tail function"
file = "NLAlib/RandomMatrix/Gaussian/BlockTail.lean"
args = ["k", "d", "t"]
latex = '2\sqrt{#1}\,(#2/(2#3))^{#2/2}/\Gamma(#2/2 + 1)'
display = '\frac{2\sqrt{#1}\,(#2/(2#3))^{#2/2}}{\Gamma(#2/2 + 1)}'
lean_body = 'gaussianPinvFrobTail (k d : ℕ) (t : ℝ) : ℝ := 2 * √(k : ℝ) * ((d : ℝ) / (2 * t)) ^ ((d : ℝ) / 2) / Real.Gamma ((d : ℝ) / 2 + 1)'
body_hash = "705ee40c6ac548fd"

