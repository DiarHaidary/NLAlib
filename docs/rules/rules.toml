# The rules of CONTRIBUTING.md, one entry per id: the single source of the rule data.
# scripts/check_rules.py and scripts/check_names.py read severity, statement, fix and scope from it;
# scripts/gen_rules_md.py generates NLAlib/<Topic>/RULES.md and docs/rules/DIGEST.md from it
# (`--check` fails when they are stale). The prose, with the reasons, is in CONTRIBUTING.md at
# `section`. A new rule gets its entry here, its check, a fixture in scripts/test_check_rules.py and
# its id in brackets where CONTRIBUTING states it (§9.2).
#
# id        area letter and number, never reused
# area      the area of the letter
# severity  error (fails CI, ratcheted), warning (a heuristic, a review list) or review (no check)
# check     source (the sources and documents), extraction (needs scripts/explore_data.sh), lean
#           (the built library, by scripts/Programs.lean), none
# scope     "library", or the topic directories the rule applies to; exclude removes directories
# exempt    directories exempt while the rule `exempt_while` has no violation (optional)
# home      topics that list a library-wide rule first in their RULES.md (optional)
# statement the rule, one line, read as the check's message
# fix       what to do about a violation

[[rule]]
id = "B1"
area = "bounds"
severity = "error"
check = "source"
scope = "library"
section = "§5.2 rule 2"
statement = '''A named bound (`…Constant`, `…Bound`, `…Tail`, `…Dim`, `…Factor`) is in docs/constants.toml'''
fix = '''Add its registry entry in the same commit'''

