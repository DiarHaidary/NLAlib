home = ["NLAlib/Sketching", "NLAlib/LowRank"]
section = "§5.2 rule 3"
statement = '''No bare `∃ C` in a statement, except in an `exists_forall_` asymptotic form'''
fix = '''Use a named constant, or an asymptotic form with `∃ C` before every dimension'''

