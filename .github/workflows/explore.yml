name: Explore data
# Extracts the declaration data for nla-lib.org/explore (scripts/explore_data.sh), publishes it as
# the asset `explore-data.json` of the rolling release `explore-data`, and asks the NLA-lib/NLA-lib.github.io
# repository to rebuild the site. Only the current `main` with successful CI publishes.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  # Serialize uploads; a delayed completion must not cancel a newer publication.
  # The live main/CI gate rejects stale runs, including after extraction.
  group: explore-data
  queue: max
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
jobs:
  explore:
    name: Extract and publish explore data
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Require passing CI for the current main commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/explore_publish.py
      - name: Build NLAlib with the Mathlib cache
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          use-mathlib-cache: true
          build-args: "NLAlib"
          lint: false
          test: false
      - name: Extract
        run: bash scripts/explore_data.sh explore-data.json
      - name: Publish to the explore-data release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/explore_publish.py
          if ! gh release view explore-data > /dev/null 2>&1; then
            gh release create explore-data --title "Explore data" --latest=false \
              --notes "Rolling data for nla-lib.org/explore; updated after successful main CI." \
              --target "$SOURCE_SHA"
          fi
          # the data file records its own commit and date; the release itself is never edited
          # (editing fails once the commit the tag was created at is gone from every branch)
          gh release upload explore-data explore-data.json --clobber
      - name: Notify NLA-lib/NLA-lib.github.io
        env:
          DISPATCH_TOKEN: ${{ secrets.EXPLORE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "EXPLORE_DISPATCH_TOKEN not set; not notifying NLA-lib/NLA-lib.github.io"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            https://api.github.com/repos/NLA-lib/NLA-lib.github.io/dispatches \
            -d "{\"event_type\":\"nlalib-updated\",\"client_payload\":{\"sha\":\"${SOURCE_SHA}\",\"ref\":\"main\"}}"
