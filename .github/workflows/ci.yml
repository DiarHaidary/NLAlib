name: CI
on:
  # every branch, so that an unapproved registry change fails where it is made (F12, Q3)
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build, lint, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NLAlibScaffold is retired and empty; it is built only while lakefile.toml still lists it
      # (the kernel replay reads every lean_lib of lakefile.toml)
      - name: Build NLAlib (and the empty NLAlibScaffold root) with the Mathlib cache; warnings are fatal
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build-args: "--wfail NLAlib NLAlibScaffold"
          lint: false
          test: false
          # no build outputs from the GitHub cache: the library is built from its sources at every
          # run, so the kernel replay checks the current sources' .olean files (final audits,
          # 2026-10-24); Mathlib's .olean files still come from `lake exe cache get`
          use-github-cache: false
      - name: Root module is current
        run: lake exe mk_all --lib NLAlib --check
      - name: Axiom audit (import NLAlib is sorry-free, no unsafe or partial constant)
        run: lake env lean scripts/Audit.lean
      - name: Environment linters
        run: lake env lean scripts/Lint.lean
      - name: Program checks (rules E2, E4 and E9, docs/design/Computation.md)
        run: lake env lean scripts/Programs.lean
      - name: Target lint (rule E3; docs/targets.toml, closure hashes, approval)
        run: lake env lean scripts/Targets.lean
      - name: Access-model fixtures (cheating realisations are false as instances)
        run: lake env lean scripts/AccessModelFixtures.lean
      - name: Tools library builds (NLAlibTools; not part of the library, may contain sorry)
        run: |
          lake build NLAlibTools
          lake exe mk_all --lib NLAlibTools --check
      - name: Build outputs are current (every hash recomputed)
        run: lake build --no-build --rehash NLAlib NLAlibScaffold NLAlibTools
      - name: Kernel replay (every constant of every lean_lib re-checked by the kernel)
        run: lake env lean scripts/Replay.lean
      - name: Kernel replay fixtures (each forgery of the final audits is rejected)
        run: bash scripts/replay_fixtures.sh
      - name: Reference keys resolve
        run: python3 scripts/check_refs.py
      - name: Generated rule files are current (docs/rules/rules.toml)
        run: python3 scripts/gen_rules_md.py --check
      - name: Port-ledger targets exist (rule G2)
        run: python3 scripts/ledger_check.py
      - name: Documentation metadata regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Named bounds show their current values
        run: python3 scripts/check_constants.py
      - name: Extract the declaration data (about a minute on the built library)
        run: bash scripts/explore_data.sh "$RUNNER_TEMP/explore-data.json"
      - name: Contribution rules by id, names (N1-N18) included, ratcheted (scripts/check_rules.py)
        run: python3 scripts/check_rules.py "$RUNNER_TEMP/explore-data.json"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Docstring LaTeX renders
        run: npm install --no-save --no-package-lock katex@0.16.22 && node scripts/check_latex.mjs
      - name: LaTeX checker regressions
        run: node --test scripts/test_check_latex.mjs
  documentation-windows:
    name: Documentation regressions (Windows)
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Documentation metadata regressions
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Install the documentation renderer
        run: npm install --no-save --no-package-lock katex@0.16.22
      - name: LaTeX checker regressions
        run: node --test scripts/test_check_latex.mjs
