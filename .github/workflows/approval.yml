name: Approval
# The registry approval is the maintainer's own commit (docs/design/Computation-Hardening.md §2.5).
# Keep the signing key off the agent host and require the code-owner review and this check on main.
on:
  pull_request:
jobs:
  registry-approval:
    name: Registry approval is the maintainer's
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every change to docs/targets.approved is a verified commit by tchen01
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          path=docs/targets.approved
          blob() {
            # An absent path gives empty output. A missing commit or unreadable tree is an error.
            git ls-tree --format='%(objectname)' "$1" -- "$path"
          }
          head_blob=$(blob "$HEAD")
          base_blob=$(blob "$BASE")
          merge_base=$(git merge-base "$BASE" "$HEAD")
          fork_blob=$(blob "$merge_base")
          tip_approved=false

          # Keep history reads outside loop expansions so any failure stops the job.
          git rev-list --full-history "$BASE..$HEAD" -- "$path" > "$RUNNER_TEMP/approval-commits"
          while IFS= read -r commit; do
            content=$(blob "$commit")
            parent_ids=$(git show -s --format=%P "$commit")
            read -r -a parents <<< "$parent_ids"
            if (( ${#parents[@]} > 1 )); then
              for parent in "${parents[@]}"; do
                parent_blob=$(blob "$parent")
                if [[ "$content" == "$parent_blob" ]]; then
                  continue 2
                fi
              done
            fi

            approved=$(gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -f oid="$commit" \
              -f query='query($owner: String!, $name: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $name) { object(oid: $oid) { ... on Commit {
                  author { user { login } }
                  committer { user { login } }
                  signature { signer { login } state wasSignedByGitHub }
                } } }
              }' --jq '.data.repository.object |
                .author.user.login == "tchen01" and .committer.user.login == "tchen01" and
                .signature.signer.login == "tchen01" and .signature.state == "VALID" and
                .signature.wasSignedByGitHub == false')
            if [[ "$approved" != true ]]; then
              echo "::error::$commit changes $path without a verified personal signature from tchen01"
              exit 1
            fi
            if [[ "$content" == "$head_blob" ]]; then
              tip_approved=true
            fi
          done < "$RUNNER_TEMP/approval-commits"

          # An inherited parent blob can be an old approval. Require provenance for a changed tip.
          if [[ "$head_blob" != "$base_blob" && "$head_blob" != "$fork_blob" && "$tip_approved" == false ]]; then
            echo "::error::no approved commit in the pull request introduced its final $path"
            exit 1
          fi
